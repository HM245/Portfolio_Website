<!doctype html>
<html lang="en" style="margin: 0; padding: 0; box-sizing: border-box;">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Business Card</title>
    <style>
      *{
        margin: 0;padding: 0;
        box-sizing: border-box;
      }
      body{
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        width:100%;
        height: 100vh;
      }
      #card_container{
          display: flex;
          width:60vw;
          height: 70vh;
          perspective: 2000px;
          margin-block: 20vh;  
      }
      @media only screen and (orientation: portrait){
        #card_container{
          display: flex;
          width:80vw;
          height: 25vh;
          perspective: 2000px;
          margin-bottom: 4vh;
        }
      }
      #card{
        display: flex;
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: 1s;
        backface-visibility: hidden;
      }
      .front, .back{
        position:absolute;
        width: 100%;
        height: 100%;
      }
      #front, #back{
        position: absolute;
        display: flex;
        width: 100%;
        height: 100%;
      }
      @media only screen and (orientation: landscape){

        #front2, #back2{
          position: absolute;
          display: flex;
          border: 6px solid black;
          border-radius: 30px;
          width: 100%;
          height: 100%;
        }
      }
      @media only screen and (orientation: portrait){
        #front2, #back2{
        position: absolute;
        display: flex;
        border: 2.5px solid black;
        border-radius: 9px;
        width: 100%;
        height: 100%;
        }
      }
      .back{
        transform: rotateY(180deg);
      }
      #card:hover {
        transform: rotateY(180deg);
      }
    </style>
  </head>
  <body>
    <div id="card_container">
      <div id="card">
        <div class="back"><img src="https://lh3.googleusercontent.com/p/AF1QipMCMNV9PWAoyXzoxolg86HCxXO-NMh-dby567Dr=s680-w680-h510-rw" id="back" alt=""></div>
        <div class="front"><img src="https://lh3.googleusercontent.com/p/AF1QipO5Bn4Hd3XLBjMVk-jMsAKhJF7GtpTnzIOTVGQA=s680-w680-h510-rw" id="front" alt=""></div>
      </div> 
    </div>
    <br>
    <br>
    <br>
    <br>
    <div id="card_container">
      <div id="card">
        <div class="back"><img src="https://lh3.googleusercontent.com/p/AF1QipOpXbzwNu5hUdSeEHk5ZyDu9wUxvNrwDF2R-u6m=s680-w680-h510" id="back2" alt="" ></div>
        <div class="front"><img src="https://lh3.googleusercontent.com/p/AF1QipOQI2xBSGLyW5egW0vWUsZQo4eWVmm-W066-2wn=s680-w680-h510" id="front2" alt=""></div>
      </div> 
    </div>
    <br>
    <br>
    <br>
    <br>
    <div id="card_container" style="height: 0.1vh;">
      <a href="index.html"><button style="margin-inline: 10vw; width: 155%; height: 20vh; font-weight: bolder; font-size: xx-large; background-color: rgb(198, 223, 245); border: none; border-radius: 20px;">BACK</button></a>
    </div>
  </body>
</html>
